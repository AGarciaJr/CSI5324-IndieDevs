services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artistconnect-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: artistconnect-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

  # Optional database service ready for database handoff
  database:
    image: postgres:16-alpine
    container_name: artistconnect-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: artistconnect
      POSTGRES_USER: artistconnect
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - db

volumes:
  db-data:
