spring.application.name=backend
server.port=${PORT:8080}

# MySQL DataSource (overridden via env vars in Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/indiedev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:indiedev_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:indiedev_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Persistent schema updates (never create-drop in runtime)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Never execute destructive SQL scripts automatically on MySQL
spring.sql.init.mode=never

# Error responses use standard problem+json format
spring.mvc.problemdetails.enabled=true