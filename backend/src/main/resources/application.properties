spring.application.name=backend
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop rebuilds the schema each time the app (or a test context) starts,
# so data.sql never inserts the sample rows twice
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Enables the H2 web console at /h2-console
spring.h2.console.enabled=true

# Error responses use the standard problem+json format
spring.mvc.problemdetails.enabled=true
